name: commission-core-and-integration-tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . -r requirements-app.txt
      - run: python -m pytest -q
      - run: python -m compileall -q app.py src web3_proof
