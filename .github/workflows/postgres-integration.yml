name: postgres-integration
on:
  push:
    branches: [feature/build-1-1-ledger]
  pull_request:
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: canicommerce_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d canicommerce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test_only@localhost:5432/canicommerce_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]' "psycopg[binary]>=3.2,<4"
      - name: Diagnose restricted worker capture and database integration
        run: python -m pytest -vv -ra tests/integration/test_worker_capture_execution.py tests/integration/test_worker_role.py
      - name: Run all PostgreSQL integration tests
        run: python -m pytest -q tests/integration
